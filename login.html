<!DOCTYPE html>
<html>
<head>
<title>Login - FinanceHubAK</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.login-box{
width:100%;
max-width:400px;
background:#171717;
padding:30px;
border-radius:15px;
border:1px solid #d4af37;
}

h1{
text-align:center;
color:#d4af37;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#c1121f;
color:white;
font-size:16px;
}

.google{
background:#d4af37;
color:black;
}

.phone{
background:#333;
}

p{
text-align:center;
margin-top:15px;
}
</style>

</head>

<body>

<div class="login-box">

<h1>FinanceHubAK</h1>

<input type="email" placeholder="Email Address">

<input type="password" placeholder="Password">

<button>Login</button>

<button class="google">
Login with Google
</button>

<button class="phone">
Login with Mobile Number
</button>

<p>
One Platform. Unlimited Financial Learning,
Investing & Growth.
</p>

</div>

</body>
</html>
